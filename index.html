<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Product Explorer 2025</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>AI Product Explorer 2025</h1>
      <p>
        Search and filter through the latest AI tools and innovations. Use the
        search box to find a specific tool or company and narrow the list by
        selecting a category. This interactive landing page is a quick way to
        explore what is new in AI this year.
      </p>
    </header>

    <section class="controls">
      <input
        type="text"
        id="searchInput"
        placeholder="Search by product, company or keywords..."
      />
      <select id="categoryFilter">
        <option value="All">All Categories</option>
      </select>
    </section>

    <section id="results" class="results"></section>

    <script src="script.js"></script>
  </body>
</html>
